<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neural Brain</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="64x64"   href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512"  href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="/icon-1024.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #05070F; }

      /* ── Top bar ─────────────────────────────────────────────────────────── */
      #topbar {
        position: fixed; top: 0; left: 0; right: 0; height: 44px;
        display: flex; align-items: center; gap: 14px;
        padding: 0 18px;
        background: rgba(5,7,15,0.72);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(100,120,200,0.12);
        z-index: 40;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #search-input {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(100,120,200,0.22);
        border-radius: 6px;
        color: #c8d0e8;
        font-size: 13px;
        padding: 5px 10px;
        width: 200px;
        outline: none;
        font-family: inherit;
        transition: border-color 0.15s;
      }
      #search-input::placeholder { color: #4a5470; }
      #search-input:focus { border-color: rgba(100,120,200,0.5); }
      #topbar-setup { display: flex; gap: 8px; align-items: center; }
      #more-btn {
        margin-left: auto;        /* pushes More to the right */
        background: rgba(255,255,255,0.06); border: 1px solid rgba(100,120,200,0.22); border-radius: 6px;
        color: #c8d0e8; font-size: 13px; padding: 5px 12px; cursor: pointer; font-family: inherit; white-space: nowrap;
      }
      #more-btn:hover, #more-btn[aria-expanded="true"] { border-color: rgba(100,120,200,0.5); }
      /* The More menu (src/topbar.js): in <body>, under the bar's right end. */
      #more-menu {
        position: fixed; top: 48px; right: 12px; z-index: 60; min-width: 280px; max-width: calc(100vw - 24px);
        background: #12162a; border: 1px solid rgba(100,120,200,0.3); border-radius: 8px; padding: 6px;
        box-shadow: 0 8px 28px rgba(0,0,0,0.5); font-family: system-ui, -apple-system, sans-serif;
      }
      #more-menu[hidden] { display: none; }
      #more-menu button {
        display: block; width: 100% !important; text-align: left !important; background: none !important;
        border: none !important; border-radius: 5px !important; padding: 7px 10px !important; margin: 0 !important;
        color: #c8d0e8 !important; font-size: 13px !important; font-weight: normal !important; white-space: nowrap;
      }
      #more-menu button:hover:not(:disabled) { background: rgba(100,120,200,0.14) !important; }
      #more-menu .more-info { font-size: 11px; color: #5a6890; padding: 4px 10px 6px; white-space: nowrap; }
      #more-setup:not(:empty) { border-bottom: 1px solid rgba(100,120,200,0.15); margin-bottom: 4px; padding-bottom: 4px; }
      #inbox-btn:hover { border-color: rgba(100,120,200,0.5) !important; }
      #topbar { overflow-x: auto; scrollbar-width: none; }
      #topbar::-webkit-scrollbar { display: none; }
      #topbar > * { flex-shrink: 0; }
      /* A failing automatic save (src/topbar.js): always visible, at every width. */
      #backup-alert {
        position: fixed; top: 44px; left: 0; right: 0; z-index: 39;
        padding: 8px 18px; max-height: 40vh; overflow-y: auto;
        background: #5a1218; border-bottom: 1px solid #c0303c; color: #ffe3e5;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
      }
      #backup-alert .backup-alert-detail { margin-top: 4px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; color: #ffc9ce; }
      #backup-alert .backup-alert-where { margin-top: 4px; font-size: 11px; color: #e8a2a8; }
      @media (max-width: 1150px) { #topbar .btn-hint { display: none; } #topbar { gap: 10px; } }
      @media (max-width: 860px)  { #search-input { width: 110px; } #topbar { gap: 8px; padding: 0 10px; } }
    </style>
  </head>
  <body>
    <div id="topbar">
      <input id="search-input" type="text" placeholder="Search…" />
      <span id="topbar-setup"></span>
      <button id="more-btn" aria-haspopup="menu" aria-expanded="false">More ▾</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
