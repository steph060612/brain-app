<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neural Brain</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #05070F; }

      /* ── Top bar ─────────────────────────────────────────────────────────── */
      #topbar {
        position: fixed; top: 0; left: 0; right: 0; height: 44px;
        display: flex; align-items: center; gap: 14px;
        padding: 0 18px;
        background: rgba(5,7,15,0.72);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(100,120,200,0.12);
        z-index: 40;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #search-input {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(100,120,200,0.22);
        border-radius: 6px;
        color: #c8d0e8;
        font-size: 13px;
        padding: 5px 10px;
        width: 200px;
        outline: none;
        font-family: inherit;
        transition: border-color 0.15s;
      }
      #search-input::placeholder { color: #4a5470; }
      #search-input:focus { border-color: rgba(100,120,200,0.5); }
      #git-time {
        font-size: 11px;
        color: #4a5470;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <input id="search-input" type="text" placeholder="Search…" />
      <span id="git-time"></span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
